<ion-header [translucent]="true">
    <ion-toolbar>
        <ion-title>Tareas</ion-title>
    </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
    <ion-header collapse="condense">
        <ion-toolbar>
            <ion-title size="large">Tareas</ion-title>
        </ion-toolbar>
    </ion-header>

    <ion-list class="ion-padding-bottom">
        <ion-item-sliding>
            <ion-item button>
              <ion-checkbox slot="start" aria-label="toggle todo completion1"></ion-checkbox>
                <ion-label> Tarea 1 </ion-label>
            </ion-item>
            <ion-item-options  side="end">
                <ion-item-option color="danger" expandable>
                  <span>Eliminar</span>
                  <ion-icon name="trash" slot="icon-only"></ion-icon>
                </ion-item-option>
            </ion-item-options>
        </ion-item-sliding>
    </ion-list>

    <ion-fab horizontal="end" vertical="bottom" slot="fixed">
        <ion-fab-button>
            <ion-icon name="add"></ion-icon>
        </ion-fab-button>
    </ion-fab>
</ion-content>
