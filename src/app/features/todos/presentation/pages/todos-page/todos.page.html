<ion-header [translucent]="true">
    <ion-toolbar>
        <ion-title>Tareas</ion-title>
    </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" [scrollY]="false">
    @if (tasks.length > 0) {
        <cdk-virtual-scroll-viewport
            itemSize="49"
            style="height: 100%; width: 100%; display: block"
        >
            <ion-list class="ion-padding-bottom">
                <ion-reorder-group [disabled]="false">
                    <ion-item-sliding #slidingItem *cdkVirtualFor="let task of tasks">
                        <ion-item button (click)="openModal(task)">
                            <ion-checkbox
                                slot="start"
                                [checked]="task.completed"
                                (click)="$event.stopPropagation()"
                                (ionChange)="onToggleComplete(task, $event)"
                            />
                            <ion-label> {{ task.name }} </ion-label>
                            <ion-reorder slot="end" />
                        </ion-item>
                        <ion-item-options side="end">
                            <ion-item-option
                                (click)="confirmDeleteTask(task.id)"
                                color="danger"
                                expandable
                            >
                                <ion-icon name="trash"></ion-icon>
                                <span slot="bottom">Eliminar</span>
                            </ion-item-option>
                        </ion-item-options>
                    </ion-item-sliding>
                </ion-reorder-group>
            </ion-list>
        </cdk-virtual-scroll-viewport>
    } @else {
        <app-data-state
            icon="alert-circle-outline"
            title="Aún no hay tareas creadas, crea la primera"
        />
    }

    <ion-fab id="task-fab" horizontal="end" vertical="bottom" slot="fixed">
        <ion-fab-button (click)="openModal()">
            <ion-icon name="add"></ion-icon>
        </ion-fab-button>
    </ion-fab>
</ion-content>
