<ion-header [translucent]="true">
    <ion-toolbar>
        <ion-title>Categorías</ion-title>
    </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" [scrollY]="false">
    @if (categories().length > 0) {
        <cdk-virtual-scroll-viewport
            itemSize="49"
            style="height: 100%; width: 100%; display: block"
        >
            <ion-list class="ion-padding-bottom">
                <ion-item
                    *cdkVirtualFor="let category of categories()"
                    button
                    (click)="openModal(category)"
                >
                    <app-color-dot [colorId]="category.colorId" slot="start" />
                    <ion-label> {{ category.name }} </ion-label>
                </ion-item>
            </ion-list>
        </cdk-virtual-scroll-viewport>
    } @else {
        <app-data-state
            icon="alert-circle-outline"
            title="Aún no hay categorías creadas, crea la primera"
        />
    }

    <ion-fab id="category-fab" horizontal="end" vertical="bottom" slot="fixed">
        <ion-fab-button (click)="openModal()">
            <ion-icon name="add"></ion-icon>
        </ion-fab-button>
    </ion-fab>
</ion-content>
