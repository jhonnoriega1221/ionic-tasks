<ion-list>
    @for (group of groups(); track group.dateKey) {
        <ion-list-header>
            <ion-label style="opacity: 0.4">{{ group.label }}</ion-label>
        </ion-list-header>
        @for (task of group.tasks; track task.id) {
            <ion-item button (click)="taskClick.emit(task)">
                <app-color-dot
                    slot="start"
                    variant="strip"
                    [colorId]="getCategoryColorId(task.categoryId)"
                />
                <ion-checkbox
                    slot="start"
                    [checked]="task.completed"
                    [color]="task.completed ? 'medium' : 'primary'"
                    [style.opacity]="task.completed ? '0.6' : '1'"
                    (click)="$event.stopPropagation()"
                    (ionChange)="onCheckboxChange(task, $event)"
                />
                <ion-label
                    [style.text-decoration]="task.completed ? 'line-through' : 'none'"
                    [style.opacity]="task.completed ? '0.3' : '1'"
                    >{{ task.name }}</ion-label
                >
            </ion-item>
        }
    }
</ion-list>
