<ion-list>
    <small style="text-align: center; display: block; margin-top: 16px; margin-bottom: 16px"
        >Filtrar por...</small
    >
    <ion-item button (click)="selectCategory('')">
        <ion-label>Todas las categorías</ion-label>
    </ion-item>
    @for (category of categories(); track category.id) {
        <ion-item button (click)="selectCategory(category.id)">
            <ion-label>{{ category.name }}</ion-label>
        </ion-item>
    }
</ion-list>
