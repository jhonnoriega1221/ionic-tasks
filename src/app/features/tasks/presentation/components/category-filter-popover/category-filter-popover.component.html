<ion-list>
    <small style="text-align: center; display: block; margin-top: 16px; margin-bottom: 16px"
        >Filtrar por...</small
    >
    <ion-item button (click)="selectCategory('')">
        <ion-icon slot="start" [name]="!selected ? 'radio-button-on' : 'radio-button-off'" />
        <ion-label>Todas las categorías</ion-label>
        <app-color-dot colorId="DEFAULT_CATEGORY_COLOR.id" slot="end" />
    </ion-item>
    @for (category of categories(); track category.id) {
        <ion-item button (click)="selectCategory(category.id)">
            <ion-icon
                slot="start"
                [name]="selected === category.id ? 'radio-button-on' : 'radio-button-off'"
            />
            <ion-label>{{ category.name }}</ion-label>
            <app-color-dot [colorId]="getCategoryColorId(category.id)" slot="end" />
        </ion-item>
    }
</ion-list>
